{% extends 'base.html' %}
{% block title %}{{ action }} Transaction - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-4"><i class="fa-solid fa-receipt me-2 text-primary"></i>{{ action }} Transaction</h3>
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Type</label>
                            <select name="type" class="form-select" required>
                                <option value="expense" {% if transaction and transaction.type == 'expense' %}selected{% endif %}>Expense</option>
                                <option value="income" {% if transaction and transaction.type == 'income' %}selected{% endif %}>Income</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00" value="{{ transaction.amount if transaction else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {% if transaction and transaction.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date</label>
                            <input type="date" name="date" class="form-control" required value="{{ transaction.date.strftime('%Y-%m-%d') if transaction else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description (Optional)</label>
                            <input type="text" name="description" class="form-control" placeholder="e.g. Grocery shopping at Walmart" value="{{ transaction.description if transaction else '' }}">
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success fw-bold"><i class="fa-solid fa-save me-1"></i> Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
